<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lab Virtual Penjernihan Air</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: meja lab — jendela ilustrasi di kiri (lengket saat menggulir), lembar kerja di kanan; bertumpuk di HP */
:root{
  --bg:#edf2f0; --surface:#ffffff; --surface-2:#f4f8f6; --ink:#0f2d2a; --ink-2:#4a625e; --ink-3:#7a8d89; --line:#d3dfdb;
  --accent:#0d7a70; --accent-ink:#ffffff; --accent-soft:#d6eeea;
  --silt:#9a6a28; --silt-soft:#f4e8d4;
  --ok:#23774a; --ok-soft:#ddf1e4; --warn:#b5561a; --warn-soft:#fbe8d8; --bad:#b8322b; --bad-soft:#f8dedb;
  --shadow:0 1px 2px rgba(15,45,42,.06),0 10px 28px -14px rgba(15,45,42,.22);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1715; --surface:#12211e; --surface-2:#172925; --ink:#e2eeeb; --ink-2:#a6bab5; --ink-3:#7a8e89; --line:#25403b;
    --accent:#3dbfb0; --accent-ink:#05221e; --accent-soft:#133a35;
    --silt:#dba95c; --silt-soft:#3a2c17;
    --ok:#5dc98b; --ok-soft:#163726; --warn:#f0a062; --warn-soft:#3d2614; --bad:#f17d73; --bad-soft:#3f1a17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1715; --surface:#12211e; --surface-2:#172925; --ink:#e2eeeb; --ink-2:#a6bab5; --ink-3:#7a8e89; --line:#25403b;
  --accent:#3dbfb0; --accent-ink:#05221e; --accent-soft:#133a35;
  --silt:#dba95c; --silt-soft:#3a2c17;
  --ok:#5dc98b; --ok-soft:#163726; --warn:#f0a062; --warn-soft:#3d2614; --bad:#f17d73; --bad-soft:#3f1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 30px -14px rgba(0,0,0,.65);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1220px;margin:0 auto;padding-inline:20px;padding-block:22px 56px;display:grid;gap:18px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
p{margin:0}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.top>div{min-width:0;flex:1 1 420px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
h1{font-weight:800;font-size:clamp(26px,4.2vw,42px);line-height:1.04;letter-spacing:-.025em}
.lede{margin-top:8px;color:var(--ink-2);max-width:62ch}
.namefield{display:grid;gap:5px;flex:0 1 270px;min-width:0}
.namefield span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px;line-height:1.5}
input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* case tabs */
.cases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.case-btn{display:flex;align-items:center;gap:12px;text-align:left;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-width:0}
.case-btn:hover:not(:disabled){border-color:var(--accent)}
.case-btn.is-cur{border-color:var(--accent);background:var(--accent-soft)}
.case-btn:disabled{cursor:not-allowed;opacity:.6}
.swatch{flex:none;width:24px;height:30px;border:2px solid var(--ink-3);border-top:none;border-radius:0 0 7px 7px;position:relative;overflow:hidden}
.swatch i{position:absolute;inset:auto 0 0 0;height:72%}
.case-txt{display:grid;min-width:0}
.case-txt b{font-weight:700;font-size:14px}
.case-txt small{color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-mark{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--surface);display:grid;place-items:center}
@media (max-width:560px){.case-btn{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}.done-mark{position:absolute;margin:0}.case-btn{position:relative}.done-mark{top:8px;right:8px}.case-txt small{white-space:normal}}

/* progress */
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.steps li{display:grid;gap:6px;font-size:13px;color:var(--ink-3);min-width:0}
.steps li::before{content:"";height:5px;border-radius:99px;background:var(--line)}
.steps li span{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.steps li b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.done{color:var(--ok)} .steps li.done::before{background:var(--ok)}
.steps li.active{color:var(--ink)} .steps li.active::before{background:var(--accent)}

/* main */
.lab{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:20px;align-items:start}
.viewer{display:grid;gap:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);min-width:0}
@media (max-width:900px){.lab{grid-template-columns:minmax(0,1fr)}.viewer{position:static}}
.frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#dfe9ec;box-shadow:var(--shadow)}
canvas{display:block;width:100%;height:auto;aspect-ratio:640/440;max-width:100%}
.caption{background:var(--surface);border:1.5px solid var(--accent);color:var(--ink);border-radius:12px;padding:10px 14px 12px;font-size:14px;line-height:1.45;display:grid;gap:6px;font-weight:600}
.caption .bar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:2px}
.caption .bar i{display:block;height:100%;width:0;background:var(--accent)}
.caption .tag{font-family:var(--f-mono);font-size:11px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:8px}
.obs{display:grid;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--ink)}
.obs span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--silt)}

/* buttons */
.btn{font:inherit;font-weight:600;font-size:14px;padding:9px 15px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not(:disabled){filter:brightness(1.07)}
.btn-big{font-size:16px;padding:13px 22px;border-radius:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-danger{border-color:var(--bad);color:var(--bad)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* sheet */
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:6px 22px 8px;min-width:0}
@media (max-width:480px){.sheet{padding:4px 16px 6px}}
.case-head{padding-block:18px 16px;display:grid;gap:6px}
.kicker{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.case-head h2{font-size:26px;font-weight:800;letter-spacing:-.02em}
.case-head p{color:var(--ink-2);max-width:62ch}
.step{border-top:1px solid var(--line);padding-block:18px;display:grid;gap:12px}
.step-h{display:flex;align-items:center;gap:10px}
.num{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;font-weight:600;background:var(--surface-2);border:1.5px solid var(--line);color:var(--ink-2)}
.step.is-done .num{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.is-active .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step-h h3{font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1;min-width:0}
.state{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
.step.is-done .state{color:var(--ok)}
.step.is-locked .step-h h3{color:var(--ink-3)}
.lockmsg{font-size:14px;color:var(--ink-3)}
.q{font-weight:600}
.hint{font-size:13px;color:var(--ink-2)}

.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{font:inherit;display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;font-weight:600;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{flex:none;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line)}
.opt.is-ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.is-ok .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.is-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt:disabled:not(.is-ok){opacity:.55}
@media (max-width:420px){.opts{grid-template-columns:minmax(0,1fr)}}

.fb{border-radius:10px;padding:11px 14px;font-size:14px;border:1px solid}
.fb b{display:block;margin-bottom:2px}
.fb-ok{background:var(--ok-soft);border-color:var(--ok)}
.fb-ok b{color:var(--ok)}
.fb-bad{background:var(--bad-soft);border-color:var(--bad)}
.fb-bad b{color:var(--bad)}

.techs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tech{font:inherit;display:grid;gap:6px;align-content:start;text-align:left;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-width:0}
.tech:hover:not(:disabled){border-color:var(--accent)}
.tech svg{width:26px;height:26px;color:var(--accent)}
.tech b{font-size:14px;line-height:1.25}
.tech small{font-size:12px;color:var(--ink-2);line-height:1.4}
.tech.is-sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.tech:disabled{cursor:not-allowed;opacity:.55}
@media (max-width:520px){.techs{grid-template-columns:minmax(0,1fr)}.tech{grid-template-columns:auto 1fr;column-gap:12px}.tech svg{grid-row:span 2}}

.runrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.runrow small{color:var(--ink-2)}
.result{border:1.5px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.result.ok{border-color:var(--ok)} .result.warn{border-color:var(--warn)} .result.bad{border-color:var(--bad)}
.result-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.result-h b{font-family:var(--f-display);font-size:17px}
.pill{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;padding:4px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.why{font-size:14px;color:var(--ink)}
.meters{display:grid;gap:12px}
.meter{display:grid;gap:5px}
.meter-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.meter-top b{font-family:var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.track{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .8s ease}
.track i.ok{background:var(--ok)} .track i.warn{background:var(--warn)} .track i.bad{background:var(--bad)}
.meter small{font-size:12px;color:var(--ink-3)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg span{font-size:12px;text-align:center;padding:4px 0;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-3)}
.seg span.on{background:var(--silt-soft);border-color:var(--silt);color:var(--ink);font-weight:700}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:none}
.tbl-title{font-size:13px;font-weight:600;color:var(--ink-2)}

.refl{display:grid;gap:14px}
.refl label{display:grid;gap:6px;font-weight:600;font-size:14px}
.wc{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);justify-self:end;font-weight:400}
.wc.ok{color:var(--ok)}
.points{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.points h4{margin:0;font-family:var(--f-display);font-size:16px}
.points ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.points p{font-size:12px;color:var(--ink-3)}

/* recap */
.recap{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 22px;display:grid;gap:14px;box-shadow:var(--shadow);min-width:0}
@media (max-width:480px){.recap{padding:16px}}
.recap h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.recap-sub{color:var(--ink-2);font-size:14px}
.recap td{white-space:normal;vertical-align:top;min-width:120px}
.recap ul{margin:0;padding-left:16px}
.rlist{display:grid;gap:12px}
.rcase{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:8px}
.rcase h4{margin:0;font-family:var(--f-display);font-size:15px}
.rcase dl{margin:0;display:grid;gap:6px;font-size:14px}
.rcase dt{font-weight:600;color:var(--ink-2);font-size:13px}
.rcase dd{margin:0 0 4px;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.copybox{width:100%;min-height:160px;font-family:var(--f-mono);font-size:12px}
.muted{color:var(--ink-3);font-size:13px}
@media (prefers-reduced-motion: reduce){.track i{transition:none}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Lab Virtual IPA · Pemisahan Campuran</p>
      <h1>Menjernihkan Air Sungai yang Tercemar</h1>
      <p class="lede">Amati sampel air di gelas kimia, kenali jenis campurannya, pilih teknologi pemisahan, lalu buktikan pilihanmu lewat simulasi.</p>
    </div>
    <label class="namefield" for="nama"><span>Nama siswa</span><input id="nama" type="text" placeholder="Tulis nama lengkapmu" autocomplete="name"></label>
  </header>

  <nav class="cases" id="cases" aria-label="Pilih kasus"></nav>
  <ol class="steps" id="steps" aria-label="Kemajuan kasus ini"></ol>

  <main class="lab">
    <section class="viewer" aria-label="Pengamatan sampel">
      <div class="frame">
        <canvas id="cv" width="640" height="440" role="img" aria-label="Ilustrasi sungai dan gelas kimia berisi sampel air"></canvas>
      </div>
      <div class="caption" id="caption" aria-live="polite" hidden></div>
      <div class="controls" id="controls"></div>
      <p class="obs" id="obs" aria-live="polite"></p>
    </section>
    <section class="sheet" id="sheet" aria-label="Lembar kerja"></section>
  </main>

  <section class="recap" id="recap" aria-label="Rekap hasil"></section>
</div>

<script>
/* ================= DATA ================= */
const CASES=[
  {name:'Air Sungai 1',short:'Keruh merata',swatch:'#c6a77f',answer:'koloid',
   desc:'Air sungai tampak keruh. Di dalamnya terdapat partikel sangat kecil yang tetap tersebar dan tidak cepat mengendap. Masyarakat membutuhkan air yang lebih jernih.'},
  {name:'Air Sungai 2',short:'Tanah & pasir',swatch:'#86603b',answer:'suspensi',
   desc:'Air sungai mengandung tanah dan pasir yang terlihat jelas. Setelah didiamkan beberapa saat, sebagian besar partikel turun ke dasar.'},
  {name:'Air Sungai 3',short:'Garam terlarut',swatch:'#8cc2d0',answer:'larutan',
   desc:'Air mengandung garam yang telah larut sempurna dan tidak membentuk endapan. Tujuannya adalah memperoleh kembali air dari campuran tersebut.'}
];
const MIX={larutan:'Larutan',koloid:'Koloid',suspensi:'Suspensi'};
const MIX_ORDER=['larutan','koloid','suspensi'];
const MIX_FB=[
  {ok:'Partikel koloid sangat kecil, tersebar merata, tidak mengendap, dan menghamburkan cahaya (efek Tyndall).',
   larutan:'Larutan bening dan tembus pandang, sedangkan air ini keruh. Tekan Sorot Senter: berkas cahayanya terlihat di dalam air, ciri yang tidak dimiliki larutan.',
   suspensi:'Partikel suspensi cukup besar sehingga mengendap jika didiamkan. Tekan Diamkan 1 Jam: apakah partikel di gelas turun ke dasar?'},
  {ok:'Suspensi berisi partikel besar yang terlihat dan dapat mengendap jika didiamkan.',
   larutan:'Pada larutan, zat terlarut tidak terlihat. Di gelas ini butiran tanah dan pasir terlihat jelas.',
   koloid:'Partikel koloid tidak mengendap. Tekan Diamkan Sebentar: butiran di gelas ini turun dan menumpuk di dasar.'},
  {ok:'Larutan bersifat homogen, zat terlarut tidak terlihat dan tidak mengendap.',
   koloid:'Koloid tampak keruh dan menghamburkan cahaya. Tekan Sorot Senter: air ini bening dan berkas cahaya tidak terlihat di dalamnya.',
   suspensi:'Suspensi membentuk endapan jika didiamkan. Tekan Diamkan 1 Jam: garam di air ini tidak mengendap sama sekali.'}
];
const ICON={
  filtrasi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16l-6 7.5V18l-4 2v-8.5z"/><path d="M7 7h10"/></svg>',
  koagulasi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="9" r="2.6"/><circle cx="14" cy="7" r="2"/><circle cx="14.5" cy="13" r="3.2"/><circle cx="8" cy="15" r="1.6"/><path d="M4 20.5h16"/></svg>',
  distilasi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v5.5L4.6 15a3.6 3.6 0 0 0 3.2 5.3h4.4a3.6 3.6 0 0 0 3.2-5.3L12 8.5V3"/><path d="M6.5 3h7"/><path d="M12 6l7 4"/><path d="M19 13v1.5"/><path d="M19 17v1"/></svg>'
};
const TECH={
  filtrasi:{name:'Filtrasi',sub:'Penyaringan lewat lapisan kerikil, pasir, dan arang'},
  koagulasi:{name:'Koagulasi-flokulasi',sub:'Tawas membuat partikel halus menggumpal lalu mengendap'},
  distilasi:{name:'Distilasi',sub:'Air diuapkan lalu diembunkan kembali'}

const V={mode:'scene',sample:null,beam:false,tl:0,tlDur:0,tlSpeed:1,tlLabel:'',settled:false,obs:'',sim:null,result:null,t:0,stage:-1};
function setScene(){const ci=S.cur;V.mode='scene';V.sample=preset(ci===2?'solutionCrystals':BEFORE[ci],SG);V.beam=false;V.tl=0;V.settled=false;V.obs=OBS[ci].rest;V.sim=null;V.result=null;$('#caption').hidden=true;}
function startTimelapse(){const ci=S.cur;
  if(ci===1&&V.settled){V.sample=preset('suspension',SG);V.settled=false;V.obs='Air diaduk kembali. Butiran tanah dan pasir kembali melayang.';renderControls();renderObs();return;}
  if(ci===1){V.sample.settling=true;V.tlDur=V.tl=3.6;V.tlSpeed=2.2;V.tlLabel='+10 menit';}else{V.tlDur=V.tl=3;V.tlSpeed=3;V.tlLabel='+1 jam';}
  V.obs='Waktu dipercepat…';renderControls();renderObs();}
function endTimelapse(){const ci=S.cur;if(ci===1)V.settled=true;V.obs=OBS[ci].after;renderControls();renderObs();}

let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;V.t+=dt;
  if(V.mode==='scene'&&V.sample){let sp=1;if(V.tl>0){sp=V.tlSpeed;V.tl-=dt;if(V.tl<=0){V.tl=0;endTimelapse();}}
    V.sample.update(dt,sp);drawScene(S.cur,V.t);if(V.beam)drawTorch(V.sample);V.sample.draw(V.beam);if(V.beam)drawExit(V.sample);
    if(S.cur===2&&!V.sample.crystals.length)tag('Kadar garam: tinggi',SG.x-158,SG.y+8);
    if(V.tl>0)drawClock(1-V.tl/V.tlDur,V.tlLabel);}
  else if(V.mode==='sim'&&V.sim){V.sim.update(dt);V.sim.draw();updateCaption();if(V.sim.t>=V.sim.dur)finishSim();}
  else if(V.mode==='result'&&V.result){V.result.update(dt);V.result.draw();}
  requestAnimationFrame(frame);}

function updateCaption(){const sim=V.sim;let idx=0;sim.stages.forEach((s,i)=>{if(sim.t>=s[0])idx=i;});const cap=$('#caption');
  if(idx!==V.stage){V.stage=idx;cap.innerHTML=`<span class="tag">${esc(TECH[sim.tech].name)} · tahap ${idx+1}/${sim.stages.length}</span><span>${esc(sim.stages[idx][1])}</span><div class="bar"><i></i></div>`;}
  const bar=cap.querySelector('.bar i');if(bar)bar.style.width=Math.min(100,sim.t/sim.dur*100)+'%';}

function runSim(){const st=S.cases[S.cur];if(!st.tech||running)return;running=true;const C={filtrasi:FiltSim,koagulasi:CoagSim,distilasi:DistSim}[st.tech];
  V.mode='sim';V.sim=new C(S.cur);V.stage=-1;V.beam=false;V.obs='Simulasi sedang berjalan. Perhatikan setiap tahapnya.';$('#caption').hidden=false;renderAll();}
function finishSim(){const sim=V.sim,ci=sim.ci,tech=sim.tech,r=RESULTS[ci][tech],st=S.cases[ci];
  st.history.push({tech,status:r.status,clarity:r.clarity,salt:r.salt});
  V.mode='result';V.result=new ResultView(ci,tech);V.sim=null;running=false;$('#caption').hidden=true;
  V.obs=`Hasil uji ${TECH[tech].name}: ${STATUS[r.status]}. Bandingkan gelas sebelum dan sesudah.`;save();renderAll();
  if(matchMedia('(max-width:900px)').matches){const el=document.getElementById('result-card');if(el)el.scrollIntoView({behavior:RM?'auto':'smooth',block:'center'});}}

const CHECK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function renderCases(){$('#cases').innerHTML=CASES.map((c,i)=>`<button class="case-btn${i===S.cur?' is-cur':''}" data-case="${i}" ${running?'disabled':''} aria-current="${i===S.cur}"><span class="swatch"><i style="background:${c.swatch}"></i></span><span class="case-txt"><b>${c.name}</b><small>${c.short}</small></span>${S.cases[i].saved?`<span class="done-mark" title="Selesai">${CHECK}</span>`:''}</button>`).join('');}
function stepStates(st){const done=[st.mixOk,!!st.tech&&st.history.length>0,success(st),st.saved];const open=[true,st.mixOk,st.mixOk&&!!st.tech,success(st)];let active=done.indexOf(false);return{done,open,active};}
function renderSteps(){const st=S.cases[S.cur],{done,active}=stepStates(st);const names=['Identifikasi','Pilih Teknologi','Uji Simulasi','Refleksi'];
  $('#steps').innerHTML=names.map((n,i)=>`<li class="${done[i]?'done':i===active?'active':''}"><span>Langkah ${i+1}</span><b>${n}</b></li>`).join('');}
function renderControls(){const el=$('#controls'),ci=S.cur;

function renderObs(){$('#obs').innerHTML=`<span>Catatan pengamatan</span>${esc(V.obs)}`;}
function meter(label,val,cls,note){return`<div class="meter"><div class="meter-top"><span>${label}</span><b>${val}%</b></div><div class="track"><i class="${cls}" style="width:${val}%"></i></div>${note?`<small>${note}</small>`:''}</div>`;}
function renderSheet(){
  const ci=S.cur,c=CASES[ci],st=S.cases[ci],{done,open,active}=stepStates(st);const fb=MIX_FB[ci];
  const stepCls=i=>`step${done[i]?' is-done':''}${i===active?' is-active':''}${!open[i]?' is-locked':''}`;
  const stateTxt=i=>done[i]?'Selesai':!open[i]?'Terkunci':'Dikerjakan';
  const head=(i,t)=>`<div class="step-h"><span class="num">${done[i]?CHECK:i+1}</span><h3>${t}</h3><span class="state">${stateTxt(i)}</span></div>`;
  let h=`<div class="case-head"><span class="kicker">Kasus ${ci+1} dari 3</span><h2>${c.name}</h2><p>${c.desc}</p></div>`;

  else if(st.mixAns)h+=`<div class="fb fb-bad" aria-live="polite"><b>Belum tepat, coba lagi.</b>${fb[st.mixAns]}</div>`;

  h+=`<div class="${stepCls(1)}" id="step2">${head(1,'Pilih teknologi')}`;

  else{h+=`<p class="q">Teknologi yang dapat digunakan untuk membantu memisahkan/menjernihkan campuran tersebut adalah...</p><div class="techs">`+
    TECH_ORDER.map((k,i)=>`<button class="tech${st.tech===k?' is-sel':''}" data-tech="${k}" aria-pressed="${st.tech===k}" ${running?'disabled':''}>${ICON[k]}<b>${'ABC'[i]}. ${TECH[k].name}</b><small>${TECH[k].sub}</small></button>`).join('')+
    `</div><p class="hint">Kamu boleh memilih teknologi apa pun. Tepat atau tidaknya akan dibuktikan lewat simulasi.</p>`;}
  h+='</div>';
  // 3

  if(!open[2])h+=`<p class="lockmsg">Pilih teknologi terlebih dahulu untuk menjalankan simulasi.</p>`;
  else{h+=`<div class="runrow"><button class="btn btn-primary btn-big" data-act="run" ${running?'disabled':''}>${running?'Simulasi berjalan…':'Jalankan Simulasi'}</button><small>Teknologi diuji: <b>${TECH[st.tech].name}</b></small></div>`;}
  if(st.history.length){const last=st.history[st.history.length-1],r=RESULTS[ci][last.tech];
    h+=`<div class="result ${r.status}" id="result-card"><div class="result-h"><b>Hasil uji: ${TECH[last.tech].name}</b><span class="pill ${r.status}">${STATUS[r.status]}</span></div><p class="why">${r.why}</p><div class="meters">`+
      meter('Kejernihan',r.clarity,r.status,`Sebelum: ${BEFORE_CLAR[ci]}%`)+
      `<div class="meter"><div class="meter-top"><span>Kadar garam</span><b>${r.salt}</b></div><div class="seg">${['rendah','sedang','tinggi'].map(x=>`<span class="${x===r.salt?'on':''}">${x}</span>`).join('')}</div><small>Sebelum: ${BEFORE_SALT[ci]}</small></div>`+
      meter('Efisiensi',r.eff,'',EFF_LABEL[last.tech])+`</div>
      <div class="actions"><button class="btn" data-act="retry" ${running?'disabled':''}>Coba Teknologi Lain</button></div></div>`;
    h+=`<p class="tbl-title">Riwayat percobaan</p><div class="tablewrap"><table><thead><tr><th>#</th><th>Teknologi</th><th>Status</th><th>Kejernihan</th><th>Garam</th></tr></thead><tbody>`+
      st.history.map((x,i)=>`<tr><td>${i+1}</td><td>${TECH[x.tech].name}</td><td><span class="pill ${x.status}">${STATUS[x.status]}</span></td><td>${x.clarity}%</td><td>${x.salt}</td></tr>`).join('')+`</tbody></table></div>`;}
  h+='</div>';
  // 4
  h+=`<div class="${stepCls(3)}" id="step4">${head(3,'Refleksi')}`;
  if(!open[3])h+=`<p class="lockmsg">Terbuka setelah ada simulasi berstatus <b>BERHASIL</b>.</p>`;
  else{h+=`<p class="hint">Jawab dengan kalimatmu sendiri, minimal 15 kata per pertanyaan.</p><div class="refl">`+
    REFL_Q.map((q,i)=>{const n=words(st.refl[i]);return`<label for="r${ci}-${i}">${i+1}. ${q}<textarea id="r${ci}-${i}" data-refl="${i}" rows="3">${esc(st.refl[i])}</textarea><span class="wc${n>=15?' ok':''}" id="wc${i}">${n}/15 kata</span></label>`;}).join('')+
    `</div><div class="actions"><button class="btn btn-primary" data-act="savere" id="savere" ${st.refl.every(x=>words(x)>=15)?'':'disabled'}>${st.saved?'Perbarui Refleksi':'Simpan Refleksi'}</button>${st.saved?'<span class="muted">Refleksi tersimpan.</span>':''}</div>`;
    if(st.saved){h+=`<div class="points"><h4>Poin penting</h4><ul><li>Metode pemisahan harus disesuaikan dengan ukuran partikel dan sifat campuran.</li><li>Satu metode sering tidak cukup. Pengolahan air nyata menggabungkan beberapa tahap: koagulasi, pengendapan, filtrasi, lalu disinfeksi.</li><li>Makin kecil partikel, makin sulit disaring. Zat yang terlarut hanya bisa dipisahkan dengan cara yang mengubah wujud, seperti penguapan atau distilasi.</li></ul><p>Bandingkan dengan jawabanmu. Ini pembanding, bukan kunci jawaban mutlak.</p></div>`;
      const next=S.cases.findIndex(x=>!x.saved);h+=`<div class="actions">${next>=0?`<button class="btn btn-primary" data-case="${next}">Lanjut ke ${CASES[next].name}</button>`:`<button class="btn btn-primary" data-act="torecap">Lihat Rekap Hasil</button>`}</div>`;}}
  h+='</div>';
  $('#sheet').innerHTML=h;}
let resetAsk=false,copyFallback=false;
function recapText(){const lines=[`REKAP LAB VIRTUAL: MENJERNIHKAN AIR SUNGAI`,`Nama: ${S.name||'-'}`,''];
  CASES.forEach((c,i)=>{const st=S.cases[i],ok=st.history.find(h=>h.status==='ok');lines.push(`${c.name}`,`  Jenis campuran: ${st.mixOk?MIX[c.answer]:'-'}`,`  Teknologi berhasil: ${ok?TECH[ok.tech].name:'-'}`,`  Riwayat: ${st.history.map(h=>`${TECH[h.tech].name} (${STATUS[h.status]}, ${h.clarity}%)`).join('; ')||'-'}`);
    REFL_Q.forEach((q,j)=>lines.push(`  ${j+1}. ${q}`,`     ${st.refl[j].trim()||'-'}`));lines.push('');});return lines.join('\n');}
function renderRecap(){const all=S.cases.every(x=>x.saved);
  let h=`<div><h2>Rekap Hasil</h2><p class="recap-sub">${S.name?`Nama siswa: <b>${esc(S.name)}</b>. `:'Isi nama siswa di bagian atas. '}${all?'Ketiga kasus sudah selesai. Salin rekap ini untuk dikirim ke guru.':'Rekap terisi otomatis. Selesaikan ketiga kasus untuk menyalin rekap.'}</p></div>`;
  h+=`<div class="tablewrap"><table><thead><tr><th>Kasus</th><th>Jenis campuran</th><th>Teknologi berhasil</th><th>Riwayat percobaan</th></tr></thead><tbody>`+
    CASES.map((c,i)=>{const st=S.cases[i],ok=st.history.find(x=>x.status==='ok');return`<tr><td><b>${c.name}</b></td><td>${st.mixOk?MIX[c.answer]:'<span class="muted">belum</span>'}</td><td>${ok?TECH[ok.tech].name:'<span class="muted">belum</span>'}</td><td>${st.history.length?'<ul>'+st.history.map(x=>`<li>${TECH[x.tech].name}: ${STATUS[x.status]} (${x.clarity}%)</li>`).join('')+'</ul>':'<span class="muted">belum ada</span>'}</td></tr>`;}).join('')+`</tbody></table></div>`;
  const saved=S.cases.map((st,i)=>[st,i]).filter(([st])=>st.saved);
  if(saved.length)h+=`<div class="rlist">`+saved.map(([st,i])=>`<div class="rcase"><h4>Refleksi · ${CASES[i].name}</h4><dl>${REFL_Q.map((q,j)=>`<dt>${j+1}. ${q}</dt><dd>${esc(st.refl[j])}</dd>`).join('')}</dl></div>`).join('')+`</div>`;
  if(resetAsk)h+=`<div class="actions"><span>Hapus semua jawaban dan mulai lagi dari awal?</span><button class="btn btn-danger" data-act="resetyes">Ya, mulai lagi</button><button class="btn" data-act="resetno">Batal</button></div>`;
  else h+=`<div class="actions"><button class="btn btn-primary" data-act="copy" ${all?'':'disabled'}>Salin Rekap</button><button class="btn" data-act="reset" ${running?'disabled':''}>Ulangi dari Awal</button><span class="muted" id="copymsg" aria-live="polite"></span></div>`;
  if(copyFallback)h+=`<textarea class="copybox" id="copybox" readonly>${esc(recapText())}</textarea>`;
  $('#recap').innerHTML=h;
  if(copyFallback){const b=$('#copybox');b.focus();b.select();}}
function renderAll(){renderCases();renderSteps();renderControls();renderObs();renderSheet();renderRecap();}

/* ================= EVENTS ================= */
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const st=S.cases[S.cur];
  if(b.dataset.case!==undefined){const i=+b.dataset.case;if(running)return;S.cur=i;setScene();save();renderAll();if(b.closest('#sheet'))window.scrollTo({top:0,behavior:RM?'auto':'smooth'});return;}
  if(b.dataset.mix){const k=b.dataset.mix;st.mixAns=k;st.tries++;st.mixOk=k===CASES[S.cur].answer;save();renderAll();return;}
  if(b.dataset.tech){st.tech=b.dataset.tech;save();renderAll();return;}
  switch(b.dataset.act){
    case 'settle':if(V.mode==='scene'&&V.tl<=0)startTimelapse();break;
    case 'beam':V.beam=!V.beam;V.obs=V.beam?OBS[S.cur].beam:(V.settled?OBS[S.cur].after:OBS[S.cur].rest);renderControls();renderObs();break;
    case 'back':setScene();renderAll();break;
    case 'run':runSim();break;
    case 'retry':st.tech=null;setScene();save();renderAll();document.getElementById('step2').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break;
    case 'savere':if(st.refl.every(x=>words(x)>=15)){st.saved=true;save();renderAll();document.getElementById('step4').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});}break;
    case 'torecap':$('#recap').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});break;
    case 'copy':{const txt=recapText();const msg=()=>document.getElementById('copymsg');
      try{navigator.clipboard.writeText(txt).then(()=>{const m=msg();if(m)m.textContent='Rekap tersalin. Tempel di WhatsApp, email, atau Google Classroom.';},()=>{copyFallback=true;renderRecap();});}catch(err){copyFallback=true;renderRecap();}break;}
    case 'reset':resetAsk=true;renderRecap();break;
    case 'resetno':resetAsk=false;renderRecap();break;
    case 'resetyes':resetAsk=false;copyFallback=false;S={name:'',cur:0,cases:[freshCase(),freshCase(),freshCase()]};$('#nama').value='';setScene();save();renderAll();window.scrollTo({top:0});break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='nama'){S.name=t.value;save();renderRecap();return;}
  if(t.dataset.refl!==undefined){const st=S.cases[S.cur],i=+t.dataset.refl;st.refl[i]=t.value;const n=words(t.value),wc=document.getElementById('wc'+i);if(wc){wc.textContent=n+'/15 kata';wc.classList.toggle('ok',n>=15);}
    const sb=document.getElementById('savere');if(sb)sb.disabled=!st.refl.every(x=>words(x)>=15);save();}
});

/* ================= START ================= */
$('#nama').value=S.name||'';
setScene();renderAll();fit();requestAnimationFrame(frame);
</script>
